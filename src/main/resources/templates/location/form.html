<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${isEdit ? 'Edit Location' : 'Create New Location'}"></title>
    <th:block th:insert="~{fragments/head :: headContent}"></th:block>
</head>
<body class="bg-gray-100 font-sans antialiased">
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mx-auto mt-8 p-4">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800" th:text="${isEdit ? 'Edit Location' : 'Create New Location'}"></h1>
        <a th:href="@{|/tenant/${tenantId}/locations|}"
           class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300 ease-in-out">
            Back to Location List
        </a>
    </div>

    <div class="bg-white p-6 rounded-lg shadow-md">
        <form th:action="${isEdit ? '/tenant/' + tenantId + '/locations/' + location.id + '/edit' : '/tenant/' + tenantId + '/locations/new'}"
              th:object="${location}" method="post" class="space-y-4">

            <input type="hidden" th:field="*{id}" th:if="${isEdit}"/>

            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Location Name</label>
                <input type="text" id="name" th:field="*{name}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
                       th:classappend="${#fields.hasErrors('name') ? 'border-red-500' : ''}">
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-sm text-red-600"></p>
            </div>

            <div>
                <label for="address" class="block text-sm font-medium text-gray-700">Address</label>
                <textarea id="address" th:field="*{address}" rows="3"
                          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
                          th:classappend="${#fields.hasErrors('address') ? 'border-red-500' : ''}"></textarea>
                <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="mt-1 text-sm text-red-600"></p>
            </div>

            <div class="flex justify-end">
                <button type="submit"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300 ease-in-out">
                    <span th:text="${isEdit ? 'Update Location' : 'Create Location'}"></span>
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
