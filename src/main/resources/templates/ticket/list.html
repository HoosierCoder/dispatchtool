<div th:fragment="content">
    <div th:if="${message}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
        <span class="block sm:inline" th:text="${message}"></span>
    </div>
    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
        <span class="block sm:inline" th:text="${error}"></span>
    </div>

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Tickets for Tenant: <span th:text="${tenantId}"></span></h1>
        <a th:href="@{|/tenant/${tenantId}/tickets/new|}"
           class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300 ease-in-out">
            Create New Ticket
        </a>
    </div>

    <div th:unless="${tickets.isEmpty()}" class="bg-white rounded-lg shadow-md overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
            <tr>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Ticket ID
                </th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Summary
                </th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Status
                </th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Assigned To
                </th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Customer
                </th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Location
                </th>
                <th scope="col" class="relative px-6 py-3">
                    <span class="sr-only">Actions</span>
                </th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
            <tr th:each="ticket : ${tickets}">
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${ticket.ticketId}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${ticket.summary}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${ticket.status}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${ticket.assignedToUserFirstName + ' ' + ticket.assignedToUserLastName}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${ticket.customerFirstName + ' ' + ticket.customerLastName}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${ticket.locationName}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                    <a th:href="@{|/tenant/${tenantId}/tickets/${ticket.ticketId}/edit|}"
                       class="text-indigo-600 hover:text-indigo-900 mr-4">Edit</a>
                    <form th:action="@{|/tenant/${tenantId}/tickets/${ticket.ticketId}/delete|}" method="post" class="inline-block" onsubmit="return confirm('Are you sure you want to delete this ticket?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="text-red-600 hover:text-red-900 bg-transparent border-none p-0 cursor-pointer">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${tickets.isEmpty()}" class="bg-white p-6 rounded-lg shadow-md text-center">
        <p class="text-gray-600 text-lg">No tickets found for this tenant.</p>
        <p class="text-gray-500 mt-2">Click "Create New Ticket" to add your first one!</p>
    </div>
</div>
