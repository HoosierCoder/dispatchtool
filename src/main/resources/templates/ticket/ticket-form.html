<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Dispatch | New Ticket</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">

<div class="flex h-screen">
    <aside class="w-64 bg-slate-800 border-r border-teal-900/50 p-6">
        <h1 class="text-2xl font-bold text-teal-400 mb-8">Dispatch</h1>
        <nav class="space-y-4">
            <a th:href="@{/tenant/dashboard}" class="block py-2.5 px-4 rounded hover:bg-slate-700 transition">Dashboard</a>
            <a th:href="@{/tickets/new}" class="block py-2.5 px-4 rounded bg-teal-600/20 text-teal-300">New Ticket</a>
        </nav>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        <header class="mb-10">
            <h2 class="text-3xl font-semibold">Create New Ticket</h2>
            <p class="text-slate-400">Enter the details for the new service ticket.</p>
        </header>

        <form th:action="@{/tickets/new}" th:object="${ticket}" method="post" class="space-y-6 max-w-lg">
            <div>
                <label for="summary" class="block text-sm font-medium text-slate-300">Summary</label>
                <input type="text" id="summary" th:field="*{summary}" class="mt-1 block w-full rounded-md border-gray-600 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm bg-slate-700 text-slate-200" required>
            </div>
            <div>
                <label for="description" class="block text-sm font-medium text-slate-300">Description</label>
                <textarea id="description" th:field="*{description}" rows="4" class="mt-1 block w-full rounded-md border-gray-600 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm bg-slate-700 text-slate-200"></textarea>
            </div>

            <div>
                <label for="customerId" class="block text-sm font-medium text-slate-300">Customer</label>
                <select id="customerId" th:field="*{customer.id}" class="mt-1 block w-full rounded-md border-gray-600 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm bg-slate-700 text-slate-200">
                    <option value="">Select a Customer</option>
                    <option th:each="customer : ${customers}" th:value="${customer.id}" th:text="${customer.firstName + ' ' + customer.lastName}"></option>
                </select>
            </div>
             <div>
                <label for="locationId" class="block text-sm font-medium text-slate-300">Location</label>
                <select id="locationId" th:field="*{location.id}" class="mt-1 block w-full rounded-md border-gray-600 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm bg-slate-700 text-slate-200">
                    <option value="">Select a Location</option>
                    <option th:each="location : ${locations}" th:value="${location.id}" th:text="${location.streetAddress}"></option>
                </select>
            </div>

            <div class="flex justify-end">
                <button type="submit" class="ml-3 inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-teal-600 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500">Create Ticket</button>
            </div>
        </form>
    </main>
</div>
</body>
</html>
