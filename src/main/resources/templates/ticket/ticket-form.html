<div th:fragment="content">
    <header class="mb-10">
        <h2 class="text-3xl font-semibold text-gray-800 dark:text-gray-100">Create New Ticket</h2>
        <p class="text-gray-500 dark:text-slate-400">Enter the details for the new service ticket.</p>
    </header>

    <form th:action="@{|/tenant/${tenantId}/tickets/new|}" th:object="${ticket}" method="post" class="space-y-6 max-w-lg">
        <div>
            <label for="summary" class="block text-sm font-medium text-gray-700 dark:text-slate-300">Summary</label>
            <input type="text" id="summary" th:field="*{summary}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-200" required>
        </div>
        <div>
            <label for="description" class="block text-sm font-medium text-gray-700 dark:text-slate-300">Description</label>
            <textarea id="description" th:field="*{description}" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-200"></textarea>
        </div>

        <div>
            <label for="customerId" class="block text-sm font-medium text-gray-700 dark:text-slate-300">Customer</label>
            <select id="customerId" th:field="*{customer.id}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-200">
                <option value="">Select a Customer</option>
                <option th:each="customer : ${customers}" th:value="${customer.id}" th:text="${customer.firstName + ' ' + customer.lastName}"></option>
            </select>
        </div>
         <div>
            <label for="locationId" class="block text-sm font-medium text-gray-700 dark:text-slate-300">Location</label>
            <select id="locationId" th:field="*{location.id}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-200">
                <option value="">Select a Location</option>
                <option th:each="location : ${locations}" th:value="${location.id}" th:text="${location.streetAddress}"></option>
            </select>
        </div>

        <div class="flex justify-end">
            <button type="submit" class="ml-3 inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-teal-600 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500">Create Ticket</button>
        </div>
    </form>
</div>
