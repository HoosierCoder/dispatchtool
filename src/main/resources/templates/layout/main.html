<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="${pageTitle ?: 'Dispatch Application'}"></title>
    <th:block th:insert="~{fragments/head :: headContent}"></th:block>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-slate-900 dark:text-slate-100 font-sans transition-colors duration-200">

<div class="flex h-screen">
    <aside class="w-64 bg-white dark:bg-slate-800 border-r border-gray-200 dark:border-teal-900/50 p-6 flex flex-col transition-colors duration-200">
        <h1 class="text-2xl font-bold text-teal-600 dark:text-teal-400 mb-8">Dispatch</h1>
        <nav class="space-y-4 flex-1">
            <!-- Navigation links from tenant-admin.html -->
            <a th:href="@{|/tenant/${#authentication.principal.tenantId}/dashboard|}" class="block py-2.5 px-4 rounded hover:bg-gray-100 dark:hover:bg-slate-700 transition">Dashboard</a>
            <a th:href="@{|/tenant/${#authentication.principal.tenantId}/tickets|}" class="block py-2.5 px-4 rounded hover:bg-gray-100 dark:hover:bg-slate-700 transition">My Tickets</a>
            <a th:href="@{|/tenant/${#authentication.principal.tenantId}/customers|}" class="block py-2.5 px-4 rounded hover:bg-gray-100 dark:hover:bg-slate-700 transition">Customers</a>
            <a th:href="@{|/tenant/${#authentication.principal.tenantId}/locations|}" class="block py-2.5 px-4 rounded hover:bg-gray-100 dark:hover:bg-slate-700 transition">Locations</a>
            <!-- Only show for Managers/Leads -->
            <a href="#" sec:authorize="hasAnyRole('MANAGER', 'LEAD', 'ADMIN')" class="block py-2.5 px-4 rounded hover:bg-gray-100 dark:hover:bg-slate-700 transition">Team Management</a>
        </nav>

        <div class="pt-8 border-t border-gray-200 dark:border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <p class="text-xs text-teal-600 dark:text-teal-500 uppercase font-bold tracking-widest" th:text="${#authentication.principal.tenantName}">Branch Name</p>

                <!-- Theme Toggle Button -->
                <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-700 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-slate-700 rounded-lg text-sm p-2.5">
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                </button>
            </div>

            <p class="text-sm text-gray-600 dark:text-slate-400 font-medium" th:text="${#authentication.principal.firstName} + ' ' + ${#authentication.principal.lastName}">User Name</p>
            <p class="text-xs text-gray-500 dark:text-slate-500 mb-4" th:text="${#authentication.principal.userRole}">Role</p>

            <form th:action="@{/logout}" method="post">
                <button type="submit" class="w-full text-left text-xs text-rose-500 hover:text-rose-600 dark:text-rose-400 dark:hover:text-rose-300 transition">
                    Sign Out
                </button>
            </form>
        </div>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        <!-- Content will be inserted here -->
        <div th:replace="${content}"></div>
    </main>
</div>

<script>
    var themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
    var themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

    // Change the icons inside the button based on previous settings
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        themeToggleLightIcon.classList.remove('hidden');
    } else {
        themeToggleDarkIcon.classList.remove('hidden');
    }

    var themeToggleBtn = document.getElementById('theme-toggle');

    themeToggleBtn.addEventListener('click', function() {

        // toggle icons inside button
        themeToggleDarkIcon.classList.toggle('hidden');
        themeToggleLightIcon.classList.toggle('hidden');

        // if set via local storage previously
        if (localStorage.getItem('theme')) {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }

        // if NOT set via local storage previously
        } else {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

    });
</script>
</body>
</html>
