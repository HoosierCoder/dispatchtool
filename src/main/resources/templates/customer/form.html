<div th:fragment="content">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800" th:text="${isEdit ? 'Edit Customer' : 'Create New Customer'}"></h1>
        <a th:href="@{|/tenant/${tenantId}/customers|}"
           class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300 ease-in-out">
            Back to Customer List
        </a>
    </div>

    <div class="bg-white p-6 rounded-lg shadow-md">
        <form th:action="${isEdit ? '/tenant/' + tenantId + '/customers/' + customer.id + '/edit' : '/tenant/' + tenantId + '/customers/new'}"
              th:object="${customer}" method="post" class="space-y-4">

            <input type="hidden" th:field="*{id}" th:if="${isEdit}"/>

            <div>
                <label for="firstName" class="block text-sm font-medium text-gray-700 dark:text-slate-300">First Name</label>
                <input type="text" id="firstName" th:field="*{firstName}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-200"
                       th:classappend="${#fields.hasErrors('firstName') ? 'border-red-500' : ''}">
                <p th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="mt-1 text-sm text-red-600"></p>
            </div>

            <div>
                <label for="lastName" class="block text-sm font-medium text-gray-700 dark:text-slate-300">Last Name</label>
                <input type="text" id="lastName" th:field="*{lastName}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-200"
                       th:classappend="${#fields.hasErrors('lastName') ? 'border-red-500' : ''}">
                <p th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="mt-1 text-sm text-red-600"></p>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 dark:text-slate-300">Email</label>
                <input type="email" id="email" th:field="*{email}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-200"
                       th:classappend="${#fields.hasErrors('email') ? 'border-red-500' : ''}">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 text-sm text-red-600"></p>
            </div>

            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700 dark:text-slate-300">Phone</label>
                <input type="tel" id="phone" th:field="*{phone}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-200"
                       th:classappend="${#fields.hasErrors('phone') ? 'border-red-500' : ''}">
                <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="mt-1 text-sm text-red-600"></p>
            </div>

            <div>
                <label for="address" class="block text-sm font-medium text-gray-700 dark:text-slate-300">Address</label>
                <textarea id="address" th:field="*{address}" rows="3"
                          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 bg-white dark:bg-slate-700 text-gray-900 dark:text-slate-200"
                          th:classappend="${#fields.hasErrors('address') ? 'border-red-500' : ''}"></textarea>
                <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="mt-1 text-sm text-red-600"></p>
            </div>

            <div class="flex justify-end">
                <button type="submit"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300 ease-in-out">
                    <span th:text="${isEdit ? 'Update Customer' : 'Create Customer'}"></span>
                </button>
            </div>
        </form>
    </div>
</div>
