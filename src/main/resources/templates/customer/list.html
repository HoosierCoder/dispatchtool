<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer List</title>
    <th:block th:insert="~{fragments/head :: headContent}"></th:block>
</head>
<body class="bg-gray-100 font-sans antialiased">
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mx-auto mt-8 p-4">
    <div th:if="${message}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
        <span class="block sm:inline" th:text="${message}"></span>
    </div>
    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
        <span class="block sm:inline" th:text="${error}"></span>
    </div>

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Customers for Tenant: <span th:text="${tenantId}"></span></h1>
        <a th:href="@{|/tenant/${tenantId}/customers/new|}"
           class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300 ease-in-out">
            Create New Customer
        </a>
    </div>

    <div th:if="${customers.isEmpty()}" class="bg-white p-6 rounded-lg shadow-md text-center">
        <p class="text-gray-600 text-lg">No customers found for this tenant.</p>
        <p class="text-gray-500 mt-2">Click "Create New Customer" to add your first one!</p>
    </div>

    <div th:unless="${customers.isEmpty()}" class="bg-white rounded-lg shadow-md overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
            <tr>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    ID
                </th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    First Name
                </th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Last Name
                </th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Email
                </th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Phone
                </th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Address
                </th>
                <th scope="col" class="relative px-6 py-3">
                    <span class="sr-only">Actions</span>
                </th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
            <tr th:each="customer : ${customers}">
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${customer.id}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${customer.firstName}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${customer.lastName}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${customer.email}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${customer.phone}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${customer.address}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                    <a th:href="@{|/tenant/${tenantId}/customers/${customer.id}/edit|}"
                       class="text-indigo-600 hover:text-indigo-900 mr-4">Edit</a>
                    <form th:action="@{|/tenant/${tenantId}/customers/${customer.id}/delete|}" method="post" class="inline-block" onsubmit="return confirm('Are you sure you want to delete this customer?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="text-red-600 hover:text-red-900 bg-transparent border-none p-0 cursor-pointer">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
