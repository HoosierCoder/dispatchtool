spring.application.name=Dispatch
debug=true

# --- Database Configuration ---
# Uses Environment Variables for Cloud/Docker deployment.
# Defaults to localhost for local development.
# DB_URL, DB_USERNAME, DB_PASSWORD should be set in your Cloud/Docker config.

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/hoosierCoder?zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${DB_USERNAME:hoosiercoder}
spring.datasource.password=${DB_PASSWORD:hoosiercoder}

spring.jpa.hibernate.ddl-auto=none

# --- Liquibase Configuration ---
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.drop-first=false
spring.liquibase.database-change-log-lock-table=DATABASECHANGELOGLOCK
spring.liquibase.test-rollback-on-update=false

# --- Web Logging ---
logging.level.liquibase=DEBUG
logging.level.org.liquibase=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.web=DEBUG

spring.main.allow-circular-references=true